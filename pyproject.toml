[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hands-diff"
version = "0.2.0"
description = "League of Legends performance shape: what's your champions (champ diff) and what's you (hands diff)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Pinned versions live in requirements.txt (the tested lock); this is the plain list.
dependencies = [
    "pandas", "pyarrow", "numpy", "scipy", "scikit-learn", "requests", "python-dotenv", "pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hands-diff = "hands_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hands_diff.report" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ on the path for `from conftest import FIXTURES_DIR`; importlib mode lets test files in
# different folders share a name (features/test_build.py vs report/test_build.py).
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
